/* ---------------------------------------------------------
   Ambient sparkle background (lightweight, CSS-driven)
--------------------------------------------------------- */
function SparkleField({ count = 26 }) {
  const sparkles = React.useMemo(() => {
    return Array.from({ length: count }).map((_, i) => ({
      id: i,
      left: Math.random() * 100,
      size: 2 + Math.random() * 3,
      duration: 9 + Math.random() * 10,
      delay: Math.random() * 10,
    }));
  }, [count]);

  return (
    <div className="sparkle-field">
      {sparkles.map(s => (
        <span
          key={s.id}
          className="sparkle"
          style={{
            left: `${s.left}%`,
            bottom: '-10px',
            width: s.size, height: s.size,
            animationDuration: `${s.duration}s`,
            animationDelay: `${s.delay}s`,
          }}
        />
      ))}
    </div>
  );
}

/* ---------------------------------------------------------
   Scroll reveal wrapper
--------------------------------------------------------- */
function Reveal({ children, className = "", delay = 0 }) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setInView(true); obs.disconnect(); } },
      { threshold: 0.15 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  return (
    <div ref={ref} className={`reveal ${inView ? 'in' : ''} ${className}`} style={{ transitionDelay: `${delay}ms` }}>
      {children}
    </div>
  );
}

/* ---------------------------------------------------------
   Countdown
--------------------------------------------------------- */
function useCountdown(targetDate) {
  const [timeLeft, setTimeLeft] = useState(() => targetDate - new Date());

  useEffect(() => {
    const id = setInterval(() => setTimeLeft(targetDate - new Date()), 1000);
    return () => clearInterval(id);
  }, [targetDate]);

  const clamped = Math.max(timeLeft, 0);
  const days = Math.floor(clamped / (1000 * 60 * 60 * 24));
  const hours = Math.floor((clamped / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((clamped / (1000 * 60)) % 60);
  const seconds = Math.floor((clamped / 1000) % 60);
  return { days, hours, minutes, seconds, done: clamped <= 0 };
}

function CountdownUnit({ value, label }) {
  return (
    <div className="flex flex-col items-center min-w-[64px] md:min-w-[84px]">
      <span className="font-display text-4xl md:text-6xl gold-text tabular-nums">{String(value).padStart(2, '0')}</span>
      <span className="text-[10px] md:text-xs tracking-[0.25em] text-muted mt-2 uppercase">{label}</span>
    </div>
  );
}

        </Reveal>
        <Reveal delay={80}>
          <h2 className="font-display text-center text-4xl md:text-5xl mb-14">Guest Wishbook</h2>
        </Reveal>

        <Reveal delay={140}>
          <form onSubmit={submit} className="glass rounded-2xl p-6 md:p-8 space-y-4 mb-12">
            <input
              value={name} onChange={e => setName(e.target.value)}
              placeholder="Your name"
              className="w-full bg-transparent border hairline rounded-lg px-4 py-3 text-sm outline-none focus:border-rose"
            />
            <textarea
              value={message} onChange={e => setMessage(e.target.value)}
              placeholder="Write a birthday message for Lily & Layla..."
              rows={3}
              className="w-full bg-transparent border hairline rounded-lg px-4 py-3 text-sm outline-none focus:border-rose resize-none"
            />
            <div className="flex flex-wrap gap-2">
              {TAGS.map(tag => (
                <button type="button" key={tag} onClick={() => addTag(tag)}
                  className="tag-pill text-xs px-3 py-1.5 rounded-full border hairline text-rose-light/90 hover:bg-rose/10">
                  {tag}
                </button>
              ))}
            </div>
            <button type="submit"
              className="btn-shimmer w-full rounded-full py-3 text-sm font-semibold text-obsidian"
              style={{ background: 'linear-gradient(120deg, #8B7057, #E8C9A0, #C89B6C)' }}>
              Post Wish
            </button>
          </form>
        </Reveal>

        <div className="space-y-4">
          {wishes.map((w, i) => (
            <Reveal key={w.id} delay={i * 60}>
              <div className="rounded-xl p-5 border hairline"
                   style={{ background: 'linear-gradient(120deg, rgba(139,112,87,0.12), rgba(44,20,32,0.25))' }}>
                <p className="text-sm text-champagne/95 mb-2">{w.message}</p>
                <p className="text-xs text-muted">— {w.name}</p>
              </div>
            </Reveal>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ---------------------------------------------------------
   Floating audio widget
--------------------------------------------------------- */
function AudioWidget() {
  const [playing, setPlaying] = useState(false);
  const audioRef = useRef(null);

  const toggle = () => {
    const audio = audioRef.current;
    if (!audio) return;
    if (playing) { audio.pause(); } else { audio.play().catch(() => {}); }
    setPlaying(p => !p);
  };

  return (
    <div className="fixed bottom-6 right-6 z-40 flex items-center gap-3 glass rounded-full pl-4 pr-2 py-2">
      {/* Replace the src below with your own celebratory track */}
      <audio ref={audioRef} loop src="" />
      <span className="text-xs text-muted hidden sm:inline">Party Soundtrack</span>
      <button
        onClick={toggle}
        aria-label={playing ? 'Pause music' : 'Play music'}
        className="w-10 h-10 rounded-full flex items-center justify-center text-obsidian"
        style={{ background: 'linear-gradient(120deg, #8B7057, #E8C9A0, #C89B6C)' }}
      >
        {playing ? (
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" /><rect x="14" y="4" width="4" height="16" /></svg>
        ) : (
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8V4z" /></svg>
        )}
      </button>
    </div>
  );
}

/* ---------------------------------------------------------
   Footer
--------------------------------------------------------- */
function Footer() {
  return (
    <footer className="relative py-14 px-6 text-center border-t hairline">
      <p className="font-display italic text-2xl gold-text mb-2">Lily & Layla</p>
      <p className="text-xs text-muted tracking-widest">SEPTEMBER 13, 2026 · OUR HOME</p>
    </footer>
  );
}

/* ---------------------------------------------------------
   App
--------------------------------------------------------- */
function App() {
  const [rsvpOpen, setRsvpOpen] = useState(false);

  const celebrate = useCallback(() => {
    const duration = 2500;
    const end = Date.now() + duration;
    const colors = ['#C89B6C', '#E8C9A0', '#F5EFE6', '#8B7057'];
    (function frame() {
      confetti({ particleCount: 4, angle: 60, spread: 65, origin: { x: 0 }, colors });
      confetti({ particleCount: 4, angle: 120, spread: 65, origin: { x: 1 }, colors });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
    confetti({ particleCount: 140, spread: 100, origin: { y: 0.4 }, colors, startVelocity: 45 });
  }, []);

  return (
    <React.Fragment>
      <NavBar />
      <Hero onCelebrate={celebrate} />
      <CelebrationHub onRsvpOpen={() => setRsvpOpen(true)} />
      <Gallery />
      <TriviaSection />
      <Wishbook />
      <Footer />
      <AudioWidget />
      <RsvpModal open={rsvpOpen} onClose={() => setRsvpOpen(false)} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
