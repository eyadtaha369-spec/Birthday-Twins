<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lily & Layla — Birthday Celebration</title>
<meta name="description" content="You're invited: Lily & Layla's birthday celebration, September 13, 2026." />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          obsidian: '#0A0910',
          panel: '#161320',
          rose: {
            DEFAULT: '#C89B6C',
            light: '#E8C9A0',
            dim: '#8B7057',
          },
          champagne: '#EFE3C8',
          ivory: '#F5EFE6',
          muted: '#A99885',
          wine: '#2C1420',
        },
        fontFamily: {
          display: ['"Cormorant Garamond"', 'serif'],
          body: ['"Manrope"', 'sans-serif'],
        },
      },
    },
  }
</script>

<style>
  html { scroll-behavior: smooth; }
  body {
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(200,155,108,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(44,20,32,0.55), transparent 55%),
      #0A0910;
    font-family: 'Manrope', sans-serif;
    color: #F5EFE6;
  }
  .font-display { font-family: 'Cormorant Garamond', serif; }

  .sparkle-field { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .sparkle {
    position: absolute;
    width: 3px; height: 3px;
    background: radial-gradient(circle, #E8C9A0 0%, rgba(232,201,160,0) 70%);
    border-radius: 999px;
    animation: drift linear infinite;
    opacity: 0.6;
  }
  @keyframes drift {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.5; }
    100% { transform: translateY(-120vh) translateX(20px); opacity: 0; }
  }

  .glass {
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border: 1px solid rgba(232,201,160,0.16);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .hairline { border-color: rgba(200,155,108,0.22); }

  .gold-text {
    background: linear-gradient(115deg, #8B7057 10%, #E8C9A0 40%, #C89B6C 60%, #8B7057 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .btn-shimmer {
    position: relative;
    overflow: hidden;
  }
  .btn-shimmer::after {
    content: '';
    position: absolute;
    top: 0; left: -150%;
    width: 60%; height: 100%;
    background: linear-gradient(115deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg);
    transition: left 0.9s ease;
  }
  .btn-shimmer:hover::after { left: 150%; }

  .reveal {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .reveal.in { opacity: 1; transform: translateY(0); }

  .flip-card { perspective: 1200px; }
  .flip-inner {
    position: relative;
    transition: transform 0.7s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }
  .flip-card.flipped .flip-inner { transform: rotateY(180deg); }
  .flip-face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .flip-back { transform: rotateY(180deg); }

  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: #0A0910; }
  ::-webkit-scrollbar-thumb { background: #3A2E23; border-radius: 8px; }

  input::placeholder, textarea::placeholder { color: #6E6153; }

  .tag-pill {
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .tag-pill:hover { transform: translateY(-2px); }

  .portrait-frame {
    transition: filter 0.5s ease, transform 0.6s ease;
  }
  .portrait-frame:hover {
    filter: brightness(1.08) saturate(1.1);
    transform: translateY(-4px);
  }
</style>
</head>
<body class="antialiased overflow-x-hidden">

<div id="root"></div>
